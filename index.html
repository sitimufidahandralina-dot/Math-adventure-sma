        // Web Audio API Sound Synthesizer (100% offline, zero external audio dependency)
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
            }
            playTone(freq, type = 'sine', duration = 0.15, vol = 0.1) {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            click() { this.playTone(600, 'sine', 0.05, 0.05); }
            correct() { 
                this.playTone(523.25, 'triangle', 0.1, 0.1);

            }

            }

            drawQuadraticGraph() {
                const canvas = document.getElementById('quad-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;

                const a = parseFloat(document.getElementById('param-a').value);
                const b = parseFloat(document.getElementById('param-b').value);
                const c = parseFloat(document.getElementById('param-c').value);

                document.getElementById('val-a').innerText = a;
                document.getElementById('val-b').innerText = b;
                document.getElementById('val-c').innerText = c;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Draw Grid & Axes
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const scale = 15;

                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy);
                ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height);
                ctx.stroke();

                // Draw Parabola Curve
                ctx.strokeStyle = '#6366f1';
                ctx.lineWidth = 3;
                ctx.beginPath();

                for (let px = -cx; px <= cx; px += 1) {
                    const x = px / scale;
                    const y = a * x * x + b * x + c;
                    const py = cy - y * scale;
                    if (px === -cx) ctx.moveTo(cx + px, py);
                    else ctx.lineTo(cx + px, py);
                }
                ctx.stroke();
            }

            drawTrigTriangle() {
                const canvas = document.getElementById('trig-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;

                const angleDeg = parseFloat(document.getElementById('param-angle').value);
                document.getElementById('val-angle').innerText = angleDeg + '°';

                const rad = angleDeg * (Math.PI / 180);
                const sinVal = Math.sin(rad);
                const cosVal = Math.cos(rad);
                const tanVal = Math.tan(rad);

                document.getElementById('trig-values').innerHTML = `
                    <div class="bg-indigo-500/10 p-2 rounded-lg text-indigo-400">sin(${angleDeg}°) = ${sinVal.toFixed(2)}</div>
                    <div class="bg-emerald-500/10 p-2 rounded-lg text-emerald-400">cos(${angleDeg}°) = ${cosVal.toFixed(2)}</div>
                    <div class="bg-amber-500/10 p-2 rounded-lg text-amber-400">tan(${angleDeg}°) = ${tanVal.toFixed(2)}</div>
                `;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Draw Right Triangle
                const startX = 50;
                const startY = canvas.height - 30;
                const baseLen = 160;
                const heightLen = baseLen * Math.tan(rad);

                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(startX + baseLen, startY);
                ctx.lineTo(startX + baseLen, startY - heightLen);
                ctx.closePath();
                ctx.stroke();

                // Labels
                ctx.fillStyle = '#f8fafc';
                ctx.font = '12px Inter';
                ctx.fillText(`θ = ${angleDeg}°`, startX + 25, startY - 10);
                ctx.fillText(`Depan`, startX + baseLen + 10, startY - heightLen/2);
                ctx.fillText(`Samping`, startX + baseLen/2 - 20, startY + 20);
            }

            startQuizSession(mode, topicId) {
                let questions = [...QUESTION_BANK];
                if (topicId) {
                    questions = questions.filter(q => q.topicId === topicId);
                }
                if (questions.length === 0) questions = [...QUESTION_BANK];

                // Shuffle questions
                questions.sort(() => Math.random() - 0.5);
                const sessionQuestions = questions.slice(0, 10);

                this.currentQuiz = {
                    mode: mode,
                    questions: sessionQuestions,
                    currentIndex: 0,
                    score: 0,
                    combo: 0,
                    maxCombo: 0,
                    userAnswers: [],
                    timerValue: 15
                };

                this.loadCurrentQuestion();
            }

            loadCurrentQuestion() {
                const q = this.currentQuiz.questions[this.currentQuiz.currentIndex];
                const total = this.currentQuiz.questions.length;

                document.getElementById('quiz-progress').style.width = `${((this.currentQuiz.currentIndex) / total) * 100}%`;
                document.getElementById('q-index').innerText = this.currentQuiz.currentIndex + 1;
                document.getElementById('q-total').innerText = total;
                document.getElementById('q-diff').innerText = q.difficulty;
                document.getElementById('q-text').innerText = q.question;

                // Hide Feedback
                const feedbackBox = document.getElementById('quiz-feedback');
                feedbackBox.className = 'hidden';

                // Render Options
                const optionsContainer = document.getElementById('q-options');
                optionsContainer.innerHTML = q.options.map((opt, idx) => `
                    <button onclick="app.submitAnswer(${idx})" class="opt-btn w-full p-4 rounded-2xl bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 text-left font-semibold text-sm md:text-base transition flex items-center justify-between border border-transparent">
                        <span>${String.fromCharCode(65 + idx)}. ${opt}</span>
                        <i class="fa-regular fa-circle text-slate-400"></i>
                    </button>
                `).join('');

                // Handle Mode Timer
                if (this.currentQuiz.mode === 'challenge') {
                    const timerElem = document.getElementById('quiz-timer');
                    timerElem.classList.remove('hidden');
                    this.currentQuiz.timerValue = 15;
                    timerElem.innerText = `⏱️ ${this.currentQuiz.timerValue}s`;
                    
                    clearInterval(this.quizTimer);
                    this.quizTimer = setInterval(() => {
                        this.currentQuiz.timerValue--;
                        timerElem.innerText = `⏱️ ${this.currentQuiz.timerValue}s`;
                        if (this.currentQuiz.timerValue <= 0) {
                            clearInterval(this.quizTimer);
                            this.submitAnswer(-1); // Time out
                        }
                    }, 1000);
                }
            }

            submitAnswer(optIndex) {
                clearInterval(this.quizTimer);
                const q = this.currentQuiz.questions[this.currentQuiz.currentIndex];
                const isCorrect = (optIndex === q.correct);
                const feedbackBox = document.getElementById('quiz-feedback');

                // Disable all option buttons
                const buttons = document.querySelectorAll('.opt-btn');
                buttons.forEach(btn => btn.onclick = null);

                if (isCorrect) {
                    sfx.correct();
                    this.currentQuiz.score++;
                    this.currentQuiz.combo++;
                    if (this.currentQuiz.combo > this.currentQuiz.maxCombo) {
                        this.currentQuiz.maxCombo = this.currentQuiz.combo;
                    }

                    if (this.currentQuiz.combo >= 3) {
                        document.getElementById('combo-badge').classList.remove('hidden');
                        document.getElementById('combo-count').innerText = this.currentQuiz.combo;
                    }

                    if (optIndex >= 0) buttons[optIndex].classList.add('border-emerald-500', 'bg-emerald-500/10');

                    feedbackBox.className = 'glass-card p-5 rounded-2xl border-l-4 border-emerald-500 bg-emerald-500/5 animate-pop space-y-2';
                    feedbackBox.innerHTML = `
                        <div class="font-black text-emerald-600 dark:text-emerald-400 flex items-center space-x-2">
                            <i class="fa-solid fa-circle-check"></i>
                            <span>🎉 Jawaban Benar! (+100 XP)</span>
                        </div>
                        <p class="text-xs text-slate-600 dark:text-slate-300 whitespace-pre-line">${q.explanation}</p>
                        <button onclick="app.nextQuestion()" class="mt-2 w-full py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-xs">Soal Berikutnya</button>
                    `;
                } else {
                    sfx.wrong();
                    this.currentQuiz.combo = 0;
                    document.getElementById('combo-badge').classList.add('hidden');

                    if (optIndex >= 0) buttons[optIndex].classList.add('border-red-500', 'bg-red-500/10');
                    if (q.correct < buttons.length) buttons[q.correct].classList.add('border-emerald-500', 'bg-emerald-500/10');

                    feedbackBox.className = 'glass-card p-5 rounded-2xl border-l-4 border-red-500 bg-red-500/5 animate-pop space-y-2';
                    feedbackBox.innerHTML = `
                        <div class="font-black text-red-600 dark:text-red-400 flex items-center space-x-2">
                            <i class="fa-solid fa-circle-xmark"></i>
                            <span>💡 Jawaban Belum Tepat</span>
                        </div>
                        <p class="text-xs text-slate-600 dark:text-slate-300 whitespace-pre-line"><b>Pembahasan:</b>\n${q.explanation}</p>
                        <button onclick="app.nextQuestion()" class="mt-2 w-full py-2.5 bg-brand-600 text-white font-bold rounded-xl text-xs">Lanjut Soal Berikutnya</button>
                    `;
                }

                // Update total stats
                this.state.totalAnswered++;
                if (isCorrect) this.state.correctAnswered++;
                this.state.accuracy = Math.round((this.state.correctAnswered / this.state.totalAnswered) * 100);
                this.checkAchievement("first_step");
                if (this.currentQuiz.maxCombo >= 5) this.checkAchievement("combo_master");
                this.saveState();
            }

            nextQuestion() {
                this.currentQuiz.currentIndex++;
                if (this.currentQuiz.currentIndex < this.currentQuiz.questions.length) {
                    this.loadCurrentQuestion();
                } else {
                    this.finishQuizSession();
                }
            }

            finishQuizSession() {
                const total = this.currentQuiz.questions.length;
                const score = this.currentQuiz.score;
                const earnedXP = score * 100 + (this.currentQuiz.maxCombo * 20);
                this.addXP(earnedXP);

                this.showModal(`
                    <div class="text-center space-y-4 py-2">
                        <div class="w-16 h-16 bg-brand-500/20 text-brand-500 rounded-full flex items-center justify-center text-3xl mx-auto">
                            <i class="fa-solid fa-trophy text-math-gold"></i>
                        </div>
                        <h3 class="text-xl font-black text-slate-800 dark:text-white">Sesi Latihan Selesai!</h3>
                        <div class="grid grid-cols-2 gap-3 py-2">
                            <div class="bg-slate-100 dark:bg-slate-800 p-3 rounded-xl">
                                <div class="text-xs text-slate-400">Skor Benar</div>
                                <div class="text-lg font-black text-brand-500">${score} / ${total}</div>
                            </div>
                            <div class="bg-slate-100 dark:bg-slate-800 p-3 rounded-xl">
                                <div class="text-xs text-slate-400">XP Diperoleh</div>
                                <div class="text-lg font-black text-math-gold">+${earnedXP} XP</div>
                            </div>
                        </div>
                        <button onclick="app.closeModal(); app.navTo('home');" class="w-full py-3 bg-brand-600 text-white font-bold rounded-xl shadow">Kembali ke Beranda</button>
                    </div>
                `);
            }

            abortQuiz() {
                clearInterval(this.quizTimer);
                this.navTo('latihan-select');
            }

            renderRumusView() {
                let allFormulas = [];
                Object.keys(CURRICULUM).forEach(cKey => {
                    CURRICULUM[cKey].topics.forEach(top => {
                        top.content.rumus.forEach(r => {
                            allFormulas.push({ ...r, topicTitle: top.title, classTitle: CURRICULUM[cKey].title });
                        });
                    });
                });

                return `
                    <div class="space-y-6 animate-pop">
                        <div class="flex items-center justify-between">
                            <button onclick="app.navTo('home')" class="text-sm font-semibold text-slate-500 flex items-center space-x-2">
                                <i class="fa-solid fa-arrow-left"></i>
                                <span>Beranda</span>
                            </button>
                            <span class="text-xs font-bold px-3 py-1 rounded-full bg-brand-500/10 text-brand-500">Bank Rumus</span>
                        </div>

                        <!-- Search Bar -->
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
                            <input type="text" id="formula-search" onkeyup="app.filterFormulas()" placeholder="Cari rumus (misal: turunan, eksponen, determinan)..." class="w-full pl-11 pr-4 py-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl text-sm focus:outline-none focus:border-brand-500">
                        </div>

                        <!-- Formula List -->
                        <div id="formula-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${allFormulas.map(f => `
                                <div class="formula-card glass-card p-5 rounded-2xl">
                                    <div class="flex justify-between items-start">
                                        <span class="text-[10px] font-bold px-2 py-0.5 bg-brand-500/10 text-brand-500 rounded-full">${f.classTitle}</span>
                                        <span class="text-xs text-slate-400 font-medium">${f.topicTitle}</span>
                                    </div>
                                    <h4 class="font-extrabold text-slate-800 dark:text-white mt-2">${f.name}</h4>
                                    <div class="math-font bg-slate-100 dark:bg-slate-800/80 p-3 rounded-xl text-brand-600 dark:text-brand-400 font-bold text-sm md:text-base mt-2">
                                        ${f.eq}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            filterFormulas() {
                const query = document.getElementById('formula-search').value.toLowerCase();
                const cards = document.querySelectorAll('.formula-card');
                cards.forEach(card => {
                    const text = card.innerText.toLowerCase();
                    if (text.includes(query)) card.style.display = 'block';
                    else card.style.display = 'none';
                });
            }

            renderKalkulatorView() {
                return `
                    <div class="max-w-md mx-auto space-y-6 animate-pop">
                        <div class="flex items-center justify-between">
                            <button onclick="app.navTo('home')" class="text-sm font-semibold text-slate-500 flex items-center space-x-2">
                                <i class="fa-solid fa-arrow-left"></i>
                                <span>Beranda</span>
                            </button>
                            <span class="text-xs font-bold px-3 py-1 rounded-full bg-cyan-500/10 text-cyan-500">Kalkulator Sains</span>
                        </div>

                        <div class="glass-card p-5 rounded-3xl space-y-4">
                            <!-- Display -->
                            <div class="bg-slate-900 p-4 rounded-2xl text-right">
                                <div id="calc-expression" class="text-xs text-slate-400 font-mono h-4"></div>
                                <div id="calc-display" class="text-2xl md:text-3xl font-black text-white font-mono mt-1 overflow-x-auto">0</div>
                            </div>

                            <!-- Buttons Pad -->
                            <div class="grid grid-cols-4 gap-2 text-sm font-bold">
                                <button onclick="app.calcInput('C')" class="p-3 rounded-xl bg-red-500/10 text-red-500">C</button>
                                <button onclick="app.calcInput('(')" class="p-3 rounded-xl bg-slate-200 dark:bg-slate-800">(</button>
                                <button onclick="app.calcInput(')')" class="p-3 rounded-xl bg-slate-200 dark:bg-slate-800">)</button>
                                <button onclick="app.calcInput('/')" class="p-3 rounded-xl bg-brand-500/10 text-brand-500">÷</button>

                                <button onclick="app.calcInput('sin(')" class="p-3 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs">sin</button>
                                <button onclick="app.calcInput('cos(')" class="p-3 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs">cos</button>
                                <button onclick="app.calcInput('tan(')" class="p-3 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs">tan</button>
                                <button onclick="app.calcInput('*')" class="p-3 rounded-xl bg-brand-500/10 text-brand-500">×</button>

                                <button onclick="app.calcInput('7')" class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800/60">7</button>
                                <button onclick="app.calcInput('8')" class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800/60">8</button>

                                <button onclick="app.calcInput('4')" class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800/60">4</button>

                                <button onclick="app.calcInput('6')" class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800/60">6</button>
                                <button onclick="app.calcInput('+')" class="p-3 rounded-xl bg-brand-500/10 text-brand-500">+</button>

                                <button onclick="app.calcInput('1')" class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800/60">1</button>
                                <button onclick="app.calcInput('2')" class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800/60">2</button>
                                <button onclick="app.calcInput('3')" class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800/60">3</button>
                                <button onclick="app.calcInput('sqrt(')" class="p-3 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs">√</button>

                                <button onclick="app.calcInput('0')" class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800/60">0</button>
                                <button onclick="app.calcInput('.')" class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800/60">.</button>
                                <button onclick="app.calcEval()" class="col-span-2 p-3 rounded-xl bg-brand-600 text-white shadow font-black">=</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            initCalculatorLogic() {
                this.calcExpr = "";
                this.checkAchievement("calculator_pro");
            }

            calcInput(val) {
                sfx.click();
                if (val === 'C') {
                    this.calcExpr = "";
                } else {
                    this.calcExpr += val;
                }
                document.getElementById('calc-display').innerText = this.calcExpr || "0";
            }

            calcEval() {
                sfx.click();
                try {
                    let sanitized = this.calcExpr
                        .replace(/sin\(/g, 'Math.sin(')
                        .replace(/cos\(/g, 'Math.cos(')
                        .replace(/tan\(/g, 'Math.tan(')
                        .replace(/sqrt\(/g, 'Math.sqrt(');
                    let res = eval(sanitized);
                    document.getElementById('calc-expression').innerText = this.calcExpr + ' =';
                    document.getElementById('calc-display').innerText = res;
                    this.calcExpr = res.toString();
                } catch(e) {
                    document.getElementById('calc-display').innerText = "Error";
                    this.calcExpr = "";
                }
            }

                            </p>

                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                <span>Lihat Petunjuk Deployment & APK</span>

                        <!-- Reset Progress Button -->

        let app;
        window.addEventListener('DOMContentLoaded', () => {
